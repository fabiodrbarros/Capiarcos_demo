name: capiarcos_demo

services:
  capiarcos-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: capiarcos_demo-capiarcos-demo
    container_name: capiarcos-demo
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
      # muda estas credenciais em produção (ou usa um ficheiro .env):
      ADMIN_USER: ${ADMIN_USER:-capiarcos}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-capiarcos-admin}
    volumes:
      # persiste as imagens carregadas no admin + titles.json entre rebuilds
      - capiarcos-catalogo:/app/public/assets/img/catalogo
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  capiarcos-catalogo:
