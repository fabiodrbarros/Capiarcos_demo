name: capiarcos_demo

services:
  capiarcos-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: capiarcos_demo-capiarcos-demo
    container_name: capiarcos-demo
    restart: unless-stopped
    ports:
      - "8080:3000"
    # Frontend estático: sem backend/admin e sem montagem dos uploads antigos.
    # O volume permanece no Docker e não deve ser removido (admin futuro).
    networks:
      # rede partilhada com o cloudflared (Cloudflare Tunnel)
      - web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  capiarcos-catalogo:

networks:
  web:
    external: true
